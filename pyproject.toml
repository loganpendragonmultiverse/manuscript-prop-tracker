[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscript-prop-tracker"
version = "1.1.1"
description = "Track important objects through manuscript milestones and flag continuity breaks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.3,<2", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
prop-track = "manuscript_prop_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
omit = ["src/*/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=manuscript_prop_tracker --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.setuptools.data-files]
"share/doc/manuscript-prop-tracker" = ["README.md", "CHANGELOG.md", "DEVELOPMENT.md", "TESTING.md"]
"share/doc/manuscript-prop-tracker/examples" = ["examples/props.json"]
